# RELEASE-08 — fonte única de versionCode/versionName do Android. android/app/build.gradle lê deste
# arquivo; não duplicar o valor em nenhum outro lugar.
#
# androidVersionCode: inteiro, SEMPRE crescente, nunca reaproveitado — é o que o Google Play usa para
# saber se um upload é "mais novo" que o anterior. Incrementar manualmente a cada envio real ao Play
# Console (nunca automatizado por este script, para nunca pular/reaproveitar um número por acidente).
# androidVersionName: string exibida ao usuário (ex.: "1.0", "1.1.0") — sem regra de formato imposta
# pelo Play, mas por convenção semver.
androidVersionCode=5
androidVersionName=1.1.2
