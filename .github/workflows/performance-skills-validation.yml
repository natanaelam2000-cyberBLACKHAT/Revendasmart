name: Performance Skills Validation

on:
  pull_request:
    paths:
      - 'client/**'
      - 'vite.config.ts'
      - '.codex/skills/**'
      - 'docs/performance/**'
      - 'scripts/performance/**'
      - 'scripts/security/validate-agent-skills.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'vite.config.ts'
      - '.codex/skills/**'
      - 'docs/performance/**'
      - 'scripts/performance/**'
      - 'scripts/security/validate-agent-skills.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate-performance-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run skills:validate
      - run: npm run build
      - run: npm run performance:bundle-check
